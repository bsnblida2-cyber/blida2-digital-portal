<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | بوابة جامعة البليدة 2</title>
<style>body{margin:0;background:#f3f8f6;color:#123d49;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 40px));background:#fff;padding:30px;border-radius:18px;box-shadow:0 16px 45px #073f3518}h1{font-size:24px;margin:0 0 8px;color:#006b54}p{color:#607b82;font-size:14px}label{display:block;margin:15px 0 5px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cadbd7;border-radius:9px;font:inherit}button,.action{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;background:#006b54;color:white;padding:12px;border-radius:9px;margin-top:18px;font:inherit;text-decoration:none;cursor:pointer}.errorlist{color:#a52626}.links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px}.links a{color:#006b54}</style></head><body><main class="card"><h1>تسجيل الدخول</h1><p>أدخل بيانات حسابك للوصول إلى فضاءات الجامعة.</p>
{% if form.errors %}<p role="alert">اسم المستخدم أو كلمة المرور غير صحيحة.</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="id_username">اسم المستخدم</label>{{ form.username }}<label for="id_password">كلمة المرور</label>{{ form.password }}<button type="submit">دخول</button></form>
<div class="links"><a href="/">العودة للرئيسية</a><a href="/accounts/signup/">إنشاء حساب</a></div></main></body></html>
