<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | بوابة جامعة البليدة 2</title>
<style>body{margin:0;background:#f3f8f6;color:#123d49;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(460px,calc(100% - 40px));background:#fff;padding:28px;border-radius:18px;box-shadow:0 16px 45px #073f3518}h1{font-size:24px;color:#006b54}p{color:#607b82;font-size:13px}label{display:block;margin:10px 0 4px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cadbd7;border-radius:9px;font:inherit}button{width:100%;border:0;background:#006b54;color:white;padding:12px;border-radius:9px;margin-top:16px;font:inherit;cursor:pointer}.helptext{display:block;color:#6b858b;font-size:11px}.errorlist{color:#a52626}</style></head><body><main class="card"><h1>إنشاء حساب مستخدم</h1><p>أنشئ حسابًا للوصول إلى فضاءات الطالب والأستاذ والباحث والموظف.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">إنشاء الحساب</button></form><p><a href="/accounts/login/">لدي حساب بالفعل — تسجيل الدخول</a></p><p><a href="/">العودة للرئيسية</a></p></main></body></html>
